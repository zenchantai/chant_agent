version: chan-period-daily-led-reference-v27
calculation_profiles:
  full: ["5", "30", "d"]
  pen_centers_only: ["w", "m"]
center_envelope_mode: owned_z_units
center_promotion_mode: verified_expansion_or_recursive_core
envelope_touch_mode: candidate
source:
  title: 读缠论108课札记
  file: ../读缠论108课札记.pdf
priority: [product_override, later_revision, original_definition]
base_timeframe: each_period
rules:
  - {id: PERIOD-PROFILE-V27, section: period_profile, priority: product_override, assertion: "日线、5分钟、30分钟保留完整结构计算；周线、月线只计算确认笔、L1笔中枢及延伸，保留内部离开回试证据，但不生成中枢关系、扩张、升级、走势、背驰或买卖点。"}
  - {id: DAILY-L2-PROJECTION-V27, section: projection, priority: product_override, assertion: "周月图独立叠加日线正式展示目录中的L2，包含活动及升级后保留的组成中枢；保持日线来源、日期、价格、家族和修订身份，不参与周月原生结构计算。"}
  - {id: DAILY-CONFIRMED-SOURCE-V27, section: confirmation, priority: product_override, assertion: "日线正式结构和跨周期L2仅使用有完成基线或匹配内容确认的已收盘日K；形成中数据只用于独立预览，未确认缓存不能因墙钟或跨日自动转为正式。"}
  - {id: RAW-5M-001, section: market_data, assertion: "各周期行情独立按时间升序去重并校验OHLC；结构不得跨越不完整区间、数据断点或序列边界。"}
  - {id: INC-001, section: inclusion, assertion: "包含关系从左向右处理；向上取高高低高，向下取低低高低，开头方向由首个非包含关系确定。"}
  - {id: FX-001, section: fractals, assertion: "顶分型中间K线高低点均严格高于左右K线，底分型反之，并在右侧K线完成时确认。"}
  - {id: PEN-NEW-001, section: pens, assertion: "新笔由交替顶底分型构成，分型不共享K线，中间至少一根独立处理后K线。"}
  - {id: PEN-NEW-002, section: pens, priority: product_override, assertion: "标准笔沿用当前工程已验证规则；本版不修改笔识别，只消费已确认笔。"}
  - {id: PEN-SPECIAL-001, section: pens, assertion: "特殊次高次低笔沿用现有规则。"}
  - {id: PEN-SPECIAL-002, section: pens, assertion: "跳空成笔沿用现有周期与标的阈值规则。"}
  - {id: PEN-SPECIAL-003, section: pens, assertion: "打横笔仅在标准笔成立且次级别对称横盘时启用。"}
  - {id: PEN-SPECIAL-004, section: pens, assertion: "修正笔只重算活动尾部，已确认稳定前缀不被未来数据改写。"}
  - {id: PEN-SPECIAL-005, section: pens, assertion: "日线缺口不直接成笔；其他周期按现有跳空规则确认。"}
  - {id: COMPONENT-CENTER-FREE-V25, section: components, assertion: "进入、连接、离开和回试组件由连续、不重复、方向交替的低级单位组成，内部不存在当前工作区可提交的同级中枢。"}
  - {id: CENTER-WORKSPACE-V25, section: centers, assertion: "中枢在走势边界后的工作区内构造，必须先有非空进入段，再选择时间最早的合法三单位核心；禁止全局滑窗。"}
  - {id: CENTER-STRICT-CORE-V25, section: centers, assertion: "核心三单位连续、已确认、方向交替并严格重叠；ZD=max(low1,low2,low3)，ZG=min(high1,high2,high3)，且ZD+epsilon<ZG。"}
  - {id: CENTER-STATE-MACHINE-V25, section: centers, assertion: "核心形成后固定ZD/ZG；后续波动依时间唯一进入延伸、暂时离开返回、离开或回试分支。"}
  - {id: CENTER-Z-WAVE-V26, section: centers, assertion: "DD/GG仅取核心第一、第三及已接纳同向延伸Z单位，进入、连接、最终离开和回试不参与；与上下文价格范围分开。"}
  - {id: CENTER-NEWBORN-EXPANSION-V26, section: centers, assertion: "核心分离且Z包络分离为新生；Z包络重叠还须确认两子中枢、连续源区间、真实连接、Z重叠见证和事件可用时间，才追加高级修订；仅接触保持候选。"}
  - {id: CENTER-FAMILY-REVISION-V25, section: hierarchy, assertion: "中枢升级沿用较早center_family_id并新增不可变高级修订；不通过传递重叠吸收后续结构。"}
  - {id: POINT-STRENGTH-VECTOR-V25, section: points, assertion: "力度先比较内部最高中枢级别和已确认子走势数，相同时再比较振幅与平均斜率；MACD仅作辅助证据。"}
  - {id: POINT-FIRST-V25, section: points, assertion: "一类点仅出现在至少两个同级中枢构成的趋势中，点位是最后离开段真实极值，后续反向低级走势完成时确认。"}
  - {id: POINT-SECOND-V25, section: points, assertion: "二类点依赖已确认一类点，第一次完整回撤不得破坏一类点极值，且不默认切分走势。"}
  - {id: POINT-THIRD-V25, section: points, assertion: "三类点由完整离开组件和第一次完整回试组件构成，回试进入核心则候选失效。"}
  - {id: MOVEMENT-POINT-BOUNDARY-V25, section: movements, assertion: "走势边界必须追溯到结构点真实端点；相邻走势只共享一个价格端点，不共享整笔或低级走势。"}
  - {id: MOVEMENT-CLASSIFICATION-V25, section: movements, assertion: "一个同级中枢为盘整；两个以上完整系统依次严格向上或向下分离为上涨或下跌；扩张不得误判同级趋势。"}
  - {id: RECURSION-V25, section: hierarchy, assertion: "L2以上只消费连续、已确认、分类明确且recursive_eligible=true的低级走势，递归上限L8。"}
  - {id: CONFIRM-V25, section: confirmation, assertion: "点位时间与确认时间分开；无法唯一确认的结构保持candidate、provisional、undetermined或truncated，禁止未来函数。"}
