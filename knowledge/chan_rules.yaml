version: chan-period-standard-pen-right-extreme-v19
source:
  title: 读缠论108课札记
  file: ../读缠论108课札记.pdf
priority: [product_override, later_revision, original_definition]
base_timeframe: "each_period"
rules:
  - {id: RAW-5M-001, section: market_data, assertion: "各周期前复权行情独立按时间升序、去重并校验OHLC；结构不得跨越本周期不完整区间。"}
  - {id: INC-001, section: inclusion, assertion: "包含关系从左向右处理；向上取高高低高，向下取低低高低，开头方向待首个非包含关系确定。", source_lessons: [62, 65], source_pages: [394, 396, 409, 410, 411]}
  - {id: FX-001, section: fractals, assertion: "顶分型中间K线高低点均严格高于左右K线，底分型反之，并在右侧K线完成时确认。", source_lessons: [62, 65, 77], source_pages: [394, 396, 411, 482]}
  - {id: PEN-NEW-001, section: pens, assertion: "新笔由交替顶底分型构成；分型不共享K线，中间至少一根独立处理后K线。", formula: "abs(right.middle_index-left.middle_index) >= 4", source_lessons: [77, 81], source_pages: [482, 520]}
  - {id: PEN-NEW-002, section: pens, priority: product_override, assertion: "标准笔要求交替分型、中间索引差至少4、顶分型中间K线高低点均高于底分型中间K线；向上终点high严格突破起点右侧确认K线high，向下终点low严格跌破起点右侧确认K线low；不比较两组三K线整体极值。普通笔失败后尝试既有特殊笔例外，均失败则保留起点继续扫描；同类分型保留能维持有效连接的更极端者，同价保留较早者。", source: "用户确认计划 2026-09-15-redesign-standard-pen-rules.md"}
  - {id: PEN-SPECIAL-001, section: pens, assertion: "特殊次高次低笔：快速行情中标准笔不足5根时，四根K线条件衡量前一端点到先出现的实际最高/最低极值，后续次高/次低分型仅作为较弱端点，且其相对极值的回撤不超过前一波幅50%。", runtime: true, source: "8月半年课第二课 笔的定义", source_pages: [2]}
  - {id: PEN-SPECIAL-002, section: pens, assertion: "跳空成笔：日线缺口不直接成笔；指数5分钟缺口超过1%、个股超过2.5%，且连续3根K线不回补时允许成笔。", runtime: true, source: "8月半年课第二课 笔的定义", source_pages: [3]}
  - {id: PEN-SPECIAL-003, section: pens, assertion: "打横笔仅在标准笔成立且次级别对称横盘时启用；收盘有效突破前高低则取消。", runtime: true, source: "8月半年课第二课 笔的定义", source_pages: [2]}
  - {id: PEN-SPECIAL-004, section: pens, assertion: "修正笔重算尾部同类极值；临时反向端点被更极端同类分型替换时，须回溯重评期间被跳过的上一端点同类极值，更极端者替换、同价保留较早者，稳定前缀不可被未来数据改写。", runtime: true, source: "8月半年课第二课 笔的定义", source_pages: [2]}
  - {id: PEN-SPECIAL-005, section: pens, assertion: "跳空成笔按周期与指数/个股阈值，连续三根K线不回补后确认；日线不直接成笔。", runtime: true, source: "8月半年课第二课 笔的定义", source_pages: [3]}
  - {id: CENTER-DIRECTIONAL-ENTRY-001, section: centers, priority: product_override, assertion: "方向性L1笔中枢由进入笔P0及其后连续三条核心笔P1/P2/P3构成；向上进入要求P0起点严格低于ZD且终点严格高于ZD，向下进入要求P0起点严格高于ZG且终点严格低于ZG。", formula: "up: start(P0)<ZD<end(P0); down: start(P0)>ZG>end(P0)", source_lessons: [17, 18, 38], source_pages: [102, 103, 243, 244]}
  - {id: CENTER-DIRECTIONAL-CORE-001, section: centers, priority: product_override, assertion: "P1/P2/P3必须方向交替且全部确认，三笔核心严格重合；成功消费P0-P3，失败仅右移一笔。中枢矩形只覆盖P1-P3。", formula: "ZD=max(low(P1..P3)); ZG=min(high(P1..P3)); ZD<ZG", source_lessons: [17, 18, 20, 38], source_pages: [102, 103, 104, 121, 243, 244]}
  - {id: CENTER-L1-EXTENSION-001, section: centers, priority: product_override, assertion: "方向性L1形成后固定ZD/ZG；后续笔区间与固定核心严格重合时吸收为同一L1的延伸，不重新生成L1。", formula: "max(pen.low,ZD)<min(pen.high,ZG)"}
  - {id: CENTER-L1-REENTRY-001, section: centers, priority: product_override, assertion: "首条不重合笔仅为暂时离开；独立新中枢确认前重新进入固定核心时，外围笔并入原L1外围范围，原核心保持不变。"}
  - {id: MOVEMENT-BASE-001, section: movements, priority: product_override, assertion: "同周期走势至少包含一个已确认方向性L1笔中枢；单中枢走势分类为盘整，方向取首中枢进入方向。"}
  - {id: MOVEMENT-TREND-001, section: movements, priority: product_override, assertion: "两个以上严格同向分离的L1中枢构成同一个趋势走势；上升要求ZD(next)>ZG(previous)，下降要求ZG(next)<ZD(previous)，接触不算趋势。"}
  - {id: MOVEMENT-BOUNDARY-001, section: movements, priority: product_override, assertion: "同级、同连续区间的已确认中枢进入方向相反且核心严格分离时，确认前一走势完成；真实极值端点与反向中枢confirmed_at分开保存。"}
  - {id: MOVEMENT-STATUS-001, section: movements, priority: product_override, assertion: "最右侧未获反向中枢确认的走势保持provisional；首中枢前的笔记为unassigned，不伪造窗口左边界。"}
  - {id: CENTER-RELATION-HIERARCHY-001, section: hierarchy, priority: product_override, assertion: "正式层级中枢独立判定延伸、新生和扩张；关系用于组织正式层级递归。"}
  - {id: CENTER-UPGRADE-EXTENSION-001, section: hierarchy, priority: product_override, assertion: "extension_3x3 仅为构成恰好三单位的特例标签；每个低级走势必须具备反向独立中枢确认依据，不按笔数自动升级。"}
  - {id: CENTER-UPGRADE-EXPANSION-001, section: hierarchy, priority: product_override, assertion: "两个同级中枢核心分离但外围重叠时启动扩张候选，等待第三个连续已完成同级走势严格重叠后确认。"}
  - {id: CENTER-PARENT-CHILD-001, section: hierarchy, priority: product_override, assertion: "高级中枢只新增父结构，低级中枢、走势和源笔永久保留。"}
  - {id: MOVEMENT-SHARED-ENDPOINT-001, section: movements, priority: product_override, assertion: "相邻正式走势只共享一个真实高低端点，不共享低级运动；实际边界与确认时间分开保存。"}
  - {id: RECURSION-001, section: hierarchy, runtime: true, assertion: "每个行情周期内独立递归中枢级别，不把行情周期直接映射为结构级别，递归上限L8。", source_lessons: [17, 18, 20, 83], source_pages: [102, 109, 119, 527]}
  - {id: CONFIRM-001, section: confirmation, assertion: "所有结构保存confirmed或provisional；确认时间取完成规则所需最后事件时间，禁止未来函数。", source_lessons: [65, 67, 77, 78], source_pages: [411, 418, 482, 489]}
  - {id: LEGACY-RECURSIVE, section: legacy, runtime: false, assertion: "旧版单层走势仅保留为历史快照审计；当前版本启用正式层级递归、级别显示颜色映射和计算器指纹快照失效。"}
  - {id: CENTER-HIERARCHY-THREE-001, section: hierarchy, priority: product_override, assertion: "三个连续交替且具备反向完成证据的低级正式走势严格重叠确认父级；两个为2/3候选；一般路径recursive_three，最高L8。"}
