version: chan-period-pen-center-l2-v1
calculation_profiles:
  pen_centers_l2: ["5", "30", "d"]
  pen_centers_only: ["w", "m"]
max_level_by_profile:
  pen_centers_l2: 2
  pen_centers_only: 1
center_envelope_mode: owned_z_units
movement_partition_mode: disabled
promotion_segment_mode: pen_native_segment_proof
center_promotion_mode: unified_segment_proof
nine_unit_mode: owned_units_from_core
center_candidate_mode: canonical_eligible_candidate
center_ownership_mode: same_level_single_owner
center_context_mode: references_do_not_own
center_lifecycle_mode: timestamped_event_arbitration
center_prefix_mode: immutable_committed_prefix
envelope_touch_mode: expansion_contact
source:
  title: 读缠论108课札记
  file: ../读缠论108课札记.pdf
priority: [product_override, later_revision, original_definition]
base_timeframe: each_period
rules:
  - {id: PERIOD-PROFILE-V27, section: period_profile, priority: product_override, assertion: "日线、5分钟、30分钟使用pen_centers_l2，保留确认笔、L1笔中枢、延伸、扩展和一次L1到L2晋级；周线、月线使用pen_centers_only，只计算确认笔和L1笔中枢及延伸，不生成L2。所有周期都不生成走势、结构买卖点或L2以上递归。"}
  - {id: DAILY-L2-PROJECTION-V27, section: projection, priority: product_override, assertion: "周月图独立叠加日线正式展示目录中的L2，包含活动及升级后保留的组成中枢；保持日线来源、日期、价格、家族和修订身份，不参与周月原生结构计算。"}
  - {id: DAILY-CONFIRMED-SOURCE-V27, section: confirmation, priority: product_override, assertion: "日线正式结构和跨周期L2仅使用有完成基线或匹配内容确认的已收盘日K；形成中数据只用于独立预览，未确认缓存不能因墙钟或跨日自动转为正式。"}
  - {id: RAW-5M-001, section: market_data, assertion: "各周期行情独立按时间升序去重并校验OHLC；结构不得跨越不完整区间、数据断点或序列边界。"}
  - {id: INC-001, section: inclusion, assertion: "包含关系从左向右处理；向上取高高低高，向下取低低高低，开头方向由首个非包含关系确定。"}
  - {id: FX-001, section: fractals, assertion: "顶分型中间K线高低点均严格高于左右K线，底分型反之，并在右侧K线完成时确认。"}
  - {id: PEN-NEW-001, section: pens, assertion: "新笔由交替顶底分型构成，分型不共享K线，中间至少一根独立处理后K线。"}
  - {id: PEN-NEW-002, section: pens, priority: product_override, assertion: "标准笔沿用当前工程已验证规则；本版不修改笔识别，只消费已确认笔。"}
  - {id: PEN-SPECIAL-001, section: pens, assertion: "特殊次高次低笔沿用现有规则。"}
  - {id: PEN-SPECIAL-002, section: pens, assertion: "跳空成笔沿用现有周期与标的阈值规则。"}
  - {id: PEN-SPECIAL-003, section: pens, assertion: "打横笔仅在标准笔成立且次级别对称横盘时启用。"}
  - {id: PEN-SPECIAL-004, section: pens, assertion: "修正笔只重算活动尾部，已确认稳定前缀不被未来数据改写。"}
  - {id: PEN-SPECIAL-005, section: pens, assertion: "日线缺口不直接成笔；其他周期按现有跳空规则确认。"}
  - {id: COMPONENT-CENTER-FREE-V25, section: components, assertion: "进入、连接、离开和回试组件由连续、不重复、方向交替的低级单位组成，内部不存在当前工作区可提交的同级中枢。"}
  - {id: CENTER-WORKSPACE-V25, section: centers, assertion: "方向由确认单位的高低点突破或独立边界证据建立；上涨取下上下、下跌取上下上。原点重叠保留待定修订，分页不重置原点。"}
  - {id: CENTER-STRICT-CORE-V25, section: centers, assertion: "核心三单位连续、已确认、方向交替并严格重叠；ZD=max(low1,low2,low3)，ZG=min(high1,high2,high3)，且ZD+epsilon<ZG。"}
  - {id: CENTER-STATE-MACHINE-V25, section: centers, assertion: "方向性核心固定ZD/ZG；同向Z与核心闭区间接触可延伸。首次完整离开回试仍按严格边界确认三类点，不能用后续回试偷换第一次。"}
  - {id: CENTER-Z-WAVE-V26, section: centers, assertion: "DD/GG仅取核心第一、第三及已接纳同向延伸Z单位，进入、连接、最终离开和回试不参与；与上下文价格范围分开。"}
  - {id: CENTER-NEWBORN-EXPANSION-V26, section: centers, assertion: "核心分离且Z闭区间接触可确认扩展事件；保存连续性、连接和真实Z见证。L1到L2由三个连续笔原生SegmentProof的真实区间交集定界，第三段可动态；缺少定界证据不提交L2，禁止包络直接升级。"}
  - {id: CENTER-PARENT-FAMILY-V30, section: hierarchy, assertion: "父中枢由父级别、连续笔流和三个SegmentProof家族建立独立family_id；低级L1子中枢保留，不因晋级改级或停用。L2生成后停止，不继续构造L3。"}
  - {id: PROMOTION-OWNED-NINE-V30, section: hierarchy, assertion: "从首个核心单位起，core、extension和peripheral合计首次达到九个连续拥有单位时触发高级构造检查；entry、departure和retest不计数，九单位不等于自动升级。"}
  - {id: SEGMENT-PEN-NATIVE-V30, section: hierarchy, assertion: "L1到L2只允许从确认笔直接构造至少三笔的SegmentProof；走势不是输入、证据或回退路径，三个连续段共同重叠后先生成动态父中枢。"}
  - {id: CENTER-CANDIDATE-ELIGIBILITY-V31, section: centers, assertion: "几何合法候选还必须通过确认、连续性、方向上下文、边界、时间和同级所有权校验，才能进入可提交候选。"}
  - {id: CENTER-CANDIDATE-SELECTION-V31, section: centers, assertion: "候选按证据可用时间、核心结束位置、核心起点位置、源单位数和稳定ID确定性选择；已提交候选不得被后续滑动窗口替换。"}
  - {id: CENTER-OWNERSHIP-LEDGER-V31, section: centers, assertion: "同一级别同一连续流的直接单位只能有一个正式拥有者；L1拥有笔，L2拥有段证明；本版本不构造L3以上。"}
  - {id: CENTER-CONTEXT-NONOWNERSHIP-V31, section: centers, assertion: "entry、departure、retest、connection和boundary_evidence只能作为上下文引用，不进入owned_unit_ids；上下文引用可以重叠。"}
  - {id: CENTER-LIFECYCLE-ARBITRATION-V31, section: centers, assertion: "旧中枢回试、外部边界和独立后继核心按证据时间仲裁；独立后继核心可在不复用拥有单位时关闭旧中枢。"}
  - {id: CENTER-PREFIX-STABILITY-V31, section: centers, assertion: "追加数据只能扩展未确认后缀；已提交候选、同级拥有权和确认前缀结果保持稳定。"}
  - {id: CONFIRM-V25, section: confirmation, assertion: "结构时间与证据可用时间分开；无法唯一确认的结构保持candidate、provisional、undetermined或truncated，禁止未来函数。"}
